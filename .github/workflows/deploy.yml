name: Deploy DuoTalk

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true   # ← siempre compilar desde cero, nunca usar capas viejas
          tags: ghcr.io/pedroprobolsas/duotalk:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            cd /root/duotalk

            # 1. Sincronizar solo el stack file (el código ya está en la imagen GHCR)
            git fetch origin main
            git reset --hard origin/main

            # 2. Descargar imagen NUEVA desde GHCR (siempre forzar pull, nunca usar cache local)
            docker pull ghcr.io/pedroprobolsas/duotalk:latest

            # 3. Redesplegar stack
            docker stack deploy -c stack-duotalk.yml duotalk --with-registry-auth

            # 4. Forzar que el servicio use exactamente el digest recién bajado
            docker service update \
              --image ghcr.io/pedroprobolsas/duotalk:latest \
              --force \
              duotalk_server

            # 5. Limpiar imágenes huérfanas
            docker image prune -f
