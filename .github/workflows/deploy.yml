name: Deploy DuoTalk

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/pedroprobolsas/duotalk:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout:  60s
          script: |
            cd /root/duotalk

            # Sincronizar código (mismo patrón que control-proven)
            git fetch origin main
            git reset --hard origin/main

            # Descargar imagen nueva desde GHCR (login ya persistido en /root/.docker/config.json)
            docker pull ghcr.io/pedroprobolsas/duotalk:latest

            # Redesplegar stack con la nueva configuración
            docker stack deploy -c stack-duotalk.yml duotalk

            # Forzar actualización especificando imagen (evita caché de :latest)
            docker service update \
              --image ghcr.io/pedroprobolsas/duotalk:latest \
              --force duotalk_server

            # Limpiar imágenes huérfanas
            docker image prune -f
